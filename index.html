<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Compute Market Map</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 32px 24px 8px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header p {
            color: #8892a4;
            font-size: 14px;
        }
        #chart {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            margin: 0 auto;
        }
        .legend-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 8px 24px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8892a4;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .info-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #151b2b;
            border: 1px solid #2a3352;
            border-radius: 12px;
            padding: 28px;
            max-width: 420px;
            width: 90%;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .info-panel h3 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #fff;
        }
        .info-panel .category-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .info-panel .details {
            font-size: 13px;
            line-height: 1.7;
            color: #a0aabe;
        }
        .info-panel .details strong { color: #cbd5e1; }
        .info-panel .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>GPU Compute Market Map</h1>
    <p>Centralization vs. Maturity &middot; Bubble size = Revenue/ARR &middot; Click any company for details</p>
</div>

<div id="chart"></div>

<div class="legend-bar" id="legend"></div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="info-panel" id="infoPanel">
    <button class="close-btn" onclick="closePanel()">&times;</button>
    <h3 id="panelName"></h3>
    <span class="category-tag" id="panelTag"></span>
    <div class="details" id="panelDetails"></div>
</div>

<script>
const CATEGORIES = {
    'Enterprise Clouds':     '#3b82f6',
    'GPU Marketplaces':      '#10b981',
    'Hybrid Models':         '#f59e0b',
    'DePIN Networks':        '#ef4444',
    'Financial Derivatives': '#a78bfa',
    'Related Platforms':     '#ec4899'
};

function parseCSV(text) {
    const lines = text.split('\n').filter(l => l.trim());
    const headers = [];
    let current = '', inQuotes = false;
    for (const ch of lines[0]) {
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { headers.push(current.trim()); current = ''; }
        else { current += ch; }
    }
    headers.push(current.trim());

    return lines.slice(1).map(line => {
        const vals = []; let cur = '', inQ = false;
        for (const ch of line) {
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
            else { cur += ch; }
        }
        vals.push(cur.trim());
        const obj = {};
        headers.forEach((h, i) => obj[h] = vals[i] || '');
        return obj;
    });
}

function parseRevenue(str) {
    if (!str || str === '0') return 0;
    // Take first number from strings like "500-600" or "50-100"
    const m = str.match(/[\d.]+/);
    return m ? parseFloat(m[0]) : 0;
}

async function init() {
    let rows;
    try {
        const resp = await fetch('gpu_companies.csv');
        const text = await resp.text();
        rows = parseCSV(text);
    } catch(e) {
        // Fallback: use embedded CSV data when fetch fails (e.g. file:// protocol)
        const embeddedCSV = `name,category,website,type,status,valuation_or_market_cap_M,total_funding_M,revenue_arr_M,yoy_growth_pct,gpu_count,gpu_types,pricing_per_hour,token,blockchain,centralization_score,maturity_score,description
CoreWeave,Enterprise Clouds,https://www.coreweave.com,Owned infrastructure (centralized),Public (NASDAQ: CRWV),36400,2000,1920,700,45000,"H100, B200, GB200",6.50,,,1.5,9,"AI factory infrastructure with deep NVIDIA integration. $2B NVIDIA investment Jan 2026. OpenAI $11.9B contract."
Lambda Labs,Enterprise Clouds,https://lambda.ai,Owned infrastructure (centralized),Private,5000-8000,1408,500-600,100,30000-50000,"H100, H200, B200, GB200",4.00-6.00,,,2.0,6,"Full-stack AI infrastructure. Hyperplane hybrid cloud orchestration. 12+ years GPU specialization."
Nebius,Enterprise Clouds,https://nebius.com,Owned + hyperscaler partnerships,Public (NASDAQ: NBIS),21450,,302 (9mo),437,,"H100, H200, B200",,,,1.5,9,"EU-based AI infra spun from Yandex. Microsoft $17-19B and Meta $3B contracts. 2.5GW by EOY 2026."
Genesis Cloud,Enterprise Clouds,https://www.genesiscloud.com,Owned infrastructure (centralized),Private,,,,50-100,,H100+,,,,2.0,4,"EU-based 100% renewable energy GPU cloud. Nordic datacenters. GDPR compliance focus."
SF Compute,GPU Marketplaces,https://www.sfcompute.com,Marketplace aggregator,Private,300,52,,,"All major types","H100, A100",,,,4.5,3,"Spot marketplace for GPU resales. Minute-level subleasing. $300M Series A valuation."
Compute Exchange,GPU Marketplaces,https://compute.exchange,Marketplace aggregator,Private,,,,,80000+,"H100, A100, consumer",,,,5.0,2,"Auction-based transparent marketplace. $2B+ facilitated since Jan 2024. Pricing Intelligence Calculator."
RunPod,GPU Marketplaces,https://www.runpod.io,Managed marketplace + platform,Private,,22,120,400-500,,30+ models (H100/A100/RTX6000/L40),1.39-1.99,,,4.5,5,"Developer-first GPU cloud. 500K developers. Bootstrapped to $24M before VC. Per-second billing."
FluidStack,GPU Marketplaces,https://www.fluidstack.io,Hybrid (62% private + 38% marketplace),Private (self-funded),,0,180,620,10000+,"H100, H200, B200, GB200",1.30-2.89,,,4.0,5,"Hybrid GPU cloud. Zero egress fees. InfiniBand fabric. Self-funded growth."
Vast.ai,GPU Marketplaces,https://vast.ai,P2P marketplace aggregator,Private,,,,,,68+ models (H100/A100/RTX4090),1.30-2.30,,,6.5,3,"Peer-to-peer GPU cloud. 500+ locations. 60-80% cheaper than AWS. Per-second billing."
Latitude.sh,GPU Marketplaces,https://www.latitude.sh,Bare metal infrastructure,Acquired (Megaport Nov 2025),300,,50-75,50,,,"H100, GH200, L40S, A100",2.41,,,3.5,5,"Bare metal GPU infra. <5 min provisioning. 20+ markets. 50% EBITDA margins. $300M+ exit."
PaleBlueDot AI,Hybrid Models,https://www.palebluedot.ai,Hybrid (marketplace + dedicated),Private,1000,150,50-100,1000,,,,,,3.5,4,"Neocloud unicorn in 18 months. Marketplace + dedicated enterprise clusters. Asia expansion focus."
Akash Network,DePIN Networks,https://akash.network,Decentralized DePIN,Token (Cosmos),356-388,,,,"H200, A100, A6000, RTX4090",1.40,AKT,Cosmos,8.5,4,"Permissionless GPU marketplace. Censorship-resistant. 60-80% cheaper than AWS."
io.net,DePIN Networks,https://io.net,Decentralized DePIN (AI-specific),Token (Solana),38-39,30,20,,139000+,Various,2.00,IO,Solana,9.0,3,"Solana-based GPU marketplace. 1M+ GPUs aggregated. 130+ countries. Proof of Time-Lock technology."
Nosana,DePIN Networks,https://nosana.com,Decentralized DePIN (inference),Token (Solana),,,,,,"Consumer + enterprise",,NOS,Solana,8.0,2,"AI inference specialization. 985K jobs completed. 2.5-6x cost savings vs traditional clouds."
Render Network,DePIN Networks,https://rendernetwork.com,Decentralized DePIN (rendering),Token (Solana),800-1000,,,,,"Distributed GPUs",,RNDR,Solana,8.0,5,"Decentralized GPU rendering for 3D/VFX. Founded 2017 by OTOY. Migrated to Solana."
Ornn Compute,Financial Derivatives,https://www.ornnai.com,Financial derivatives,Private,,5.7,0,,,,,,3.0,1,"GPU price indices (OCPI) and futures contracts. CFTC-aligned. Asian-style settlement."
One Chronos,Financial Derivatives,,Financial derivatives (auctions),Private,,,,,,,,,,3.0,1,"GPU futures via combinatorial auctions. Nobel economist Paul Milgrom partnership."
Architect Financial,Financial Derivatives,https://www.architectfinance.com,Regulated futures exchange,Private,,,,,,,,,,3.5,2,"Bermuda-regulated exchange. Perpetual contracts for GPU compute and DRAM pricing. Live Jan 2026."
Forward Compute,Financial Derivatives,https://computeforward.com,Forward marketplace,Private,,,,,,,,,,4.0,1,"Forward marketplace for pre-built GPU clusters. Tiered verification. Founded 2024+."
Northflank,Related Platforms,https://northflank.com,Multi-cloud orchestration,Private,,,,,,,,,,3.0,3,"Multi-cloud GPU orchestration. Serverless with microVM isolation. BYOC support."
Zadara,Related Platforms,https://www.zadara.com,Sovereign private cloud,Private,,,,,,,,,,2.5,4,"500+ edge locations. AWS-compatible APIs. Consumption-based. Data sovereignty focus."
OVHcloud,Related Platforms,https://www.ovhcloud.com,EU public cloud,Public,,,,,"H100, A100, L4, L40S",,,,2.0,7,"European public cloud. 28 datacenters. 20%+ cheaper than AWS/Azure."
Hyperstack,Related Platforms,https://www.hyperstack.cloud,Owned datacenter,Private,,45,,,,"NVLink SXM GPUs",,,,2.5,3,"AI Supercloud. 8-16384 GPU clusters. 350 Gbps networking. WEKA storage partnership."
Crusoe Energy,Related Platforms,https://www.crusoe.ai,Vertically integrated energy + GPU,Private,,1000+,,,946000,,,,,2.0,5,"Energy-first model. 3.4GW capacity. 81% cost savings vs AWS claimed. 100% renewable/stranded energy."`;
        rows = parseCSV(embeddedCSV);
    }

    const companies = rows.map(r => ({
        name: r.name,
        x: parseFloat(r.centralization_score) || 5,
        y: parseFloat(r.maturity_score) || 5,
        rev: parseRevenue(r.revenue_arr_M),
        cat: r.category,
        desc: r.description,
        website: r.website,
        status: r.status,
        funding: r.total_funding_M,
        growth: r.yoy_growth_pct,
        gpu_types: r.gpu_types,
        pricing: r.pricing_per_hour,
        token: r.token
    }));

    const maxRev = Math.max(...companies.map(c => c.rev), 1);
    const traces = [];

    for (const [cat, color] of Object.entries(CATEGORIES)) {
        const subset = companies.filter(c => c.cat === cat);
        if (!subset.length) continue;
        const sizes = subset.map(c => Math.max(12, Math.sqrt(c.rev / maxRev) * 70));

        traces.push({
            x: subset.map(c => c.x),
            y: subset.map(c => c.y),
            text: subset.map(c => c.name),
            customdata: subset.map(c => [c.name, c.rev, c.cat, c.desc, c.website, c.status, c.funding, c.growth, c.gpu_types, c.pricing, c.token]),
            hovertemplate: '<b>%{text}</b><br>Revenue: $%{customdata[1]}M<br>%{customdata[3]}<extra></extra>',
            mode: 'markers+text',
            type: 'scatter',
            name: cat,
            textposition: 'top center',
            textfont: { size: 9, color: '#8892a4' },
            marker: {
                size: sizes,
                color: color,
                opacity: 0.75,
                line: { color: color, width: 1.5 },
                sizemode: 'diameter'
            },
            showlegend: false
        });
    }

const layout = {
    paper_bgcolor: '#0a0e17',
    plot_bgcolor: '#0f1524',
    font: { color: '#8892a4', family: 'Inter, sans-serif' },
    xaxis: {
        title: { text: '← Centralized ———————— Decentralized →', font: { size: 13, color: '#64748b' } },
        range: [0, 10.5],
        dtick: 1,
        gridcolor: '#1a2235',
        zerolinecolor: '#1a2235',
        tickfont: { size: 10 }
    },
    yaxis: {
        title: { text: '← Pre-Revenue ———————— Public →', font: { size: 13, color: '#64748b' } },
        range: [0, 11],
        dtick: 1,
        gridcolor: '#1a2235',
        zerolinecolor: '#1a2235',
        tickfont: { size: 10 }
    },
    margin: { l: 70, r: 30, t: 20, b: 60 },
    hovermode: 'closest',
    dragmode: 'pan'
};

const config = {
    responsive: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d'],
    displaylogo: false
};

    Plotly.newPlot('chart', traces, layout, config);

    // Click handler for info panel
    document.getElementById('chart').on('plotly_click', function(data) {
        const pt = data.points[0];
        const [name, rev, cat, desc, website, status, funding, growth, gpuTypes, pricing, token] = pt.customdata;
        const color = CATEGORIES[cat];
        document.getElementById('panelName').textContent = name;
        const tag = document.getElementById('panelTag');
        tag.textContent = cat;
        tag.style.background = color + '22';
        tag.style.color = color;

        let html = `<strong>Revenue / ARR:</strong> $${Number(rev).toLocaleString()}M<br>`;
        html += `<strong>Centralization:</strong> ${pt.x.toFixed(1)} / 10<br>`;
        html += `<strong>Maturity:</strong> ${pt.y.toFixed(1)} / 10<br>`;
        if (status) html += `<strong>Status:</strong> ${status}<br>`;
        if (funding) html += `<strong>Funding:</strong> $${funding}M<br>`;
        if (growth) html += `<strong>YoY Growth:</strong> ${growth}%<br>`;
        if (gpuTypes) html += `<strong>GPUs:</strong> ${gpuTypes}<br>`;
        if (pricing) html += `<strong>Pricing:</strong> $${pricing}/hr<br>`;
        if (token) html += `<strong>Token:</strong> ${token}<br>`;
        html += `<br>${desc}`;
        if (website) html += `<br><br><a href="${website}" target="_blank" style="color:${color}">${website}</a>`;

        document.getElementById('panelDetails').innerHTML = html;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('infoPanel').style.display = 'block';
    });
}

init();

function closePanel() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('infoPanel').style.display = 'none';
}

// Build legend
const legendEl = document.getElementById('legend');
for (const [cat, color] of Object.entries(CATEGORIES)) {
    legendEl.innerHTML += `<div class="legend-item"><span class="legend-dot" style="background:${color}"></span>${cat}</div>`;
}
</script>
</body>
</html>
